/**
 * Top-level build file for robot-reset-app.
 *
 * Standalone Android project — no dependency on the FTC SDK. Builds a small
 * AccessibilityService APK that resolves and clicks UI elements on the FTC
 * Driver Station app. See docs/robot-reset-app-brief.md and
 * docs/design-accessibility-tap.md for the full design.
 */

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
