# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# We no longer need to auto-convert third-party libraries to use AndroidX, which slowed down the build
android.enableJetifier=false

# Allow Gradle to use up to 1 GB of RAM
org.gradle.jvmargs=-Xmx1024M

android.nonTransitiveRClass=false

# Pinned to the JDK 21 installed for this project (AGP 8.7 / Gradle 8.13 do not
# support newer JDKs). Machine-specific path, matching this repo's existing
# convention of hardcoded local paths (see docs/). Override with
# org.gradle.java.home in ~/.gradle/gradle.properties or -Dorg.gradle.java.home
# if building on a different machine.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.11.10-hotspot