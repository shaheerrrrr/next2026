apply plugin: 'com.android.application'

android {
    namespace 'com.next2026.robotreset'
    compileSdk 34

    defaultConfig {
        applicationId "com.next2026.robotreset"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
